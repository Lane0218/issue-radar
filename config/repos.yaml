    repo: llvm-project
    query: 'is:issue is:open docs'
    source_signals:
      - documentation_keyword
    sort: created
    order: desc
    max_issues: 6
    max_comments: 30

  - key: llvm-project-test-keyword
    owner: llvm
    repo: llvm-project
    query: 'is:issue is:open test'
    source_signals:
      - tests
    sort: created
    order: desc
    max_issues: 6
    max_comments: 30

  - key: llvm-project-typo-keyword
    owner: llvm
    repo: llvm-project
    query: 'is:issue is:open typo'
    source_signals:
      - documentation_keyword
    sort: created
